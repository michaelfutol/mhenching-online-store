name: Storefront CI

on:
  pull_request:
    paths:
      - "apps/storefront/**"
      - "package.json"
      - ".github/workflows/storefront-ci.yml"
  push:
    branches:
      - phase-1-storefront-shell
    paths:
      - "apps/storefront/**"
      - "package.json"
      - ".github/workflows/storefront-ci.yml"

jobs:
  verify-storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
