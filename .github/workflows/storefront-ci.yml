name: App CI

on:
  pull_request:
    paths:
      - "apps/storefront/**"
      - "packages/**"
      - "database/**"
      - "package.json"
      - ".github/workflows/storefront-ci.yml"
  push:
    branches:
      - phase-1-storefront-shell
      - phase-2-commerce-backend
    paths:
      - "apps/storefront/**"
      - "packages/**"
      - "database/**"
      - "package.json"
      - ".github/workflows/storefront-ci.yml"

jobs:
  verify-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck storefront and contracts
        run: npm run typecheck

      - name: Production build
        run: npm run build
